name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Fail if the app gains internet access
        run: |
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*' | head -1)
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "The INTERNET permission must stay removed. See CONTRIBUTING.md." >&2
            exit 1
          fi
